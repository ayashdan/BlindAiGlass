<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Tell the phone to size the page to the screen and not let the user zoom by accident.
       "viewport-fit=cover" lets us paint under the iPhone's notch / rounded corners. -->
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <!-- These two lines make iOS treat the page more like a real app when saved to the Home Screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <title>BlindAiGlass</title>

  <!-- Our styles and our PWA manifest (the file that lets it be "installed"). -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>

<body>
  <!--
    The camera picture is drawn into this <video> element.
    - playsinline: REQUIRED on iPhone, otherwise video tries to go fullscreen and breaks.
    - muted + autoplay: needed so iOS allows the video to play on its own.
    aria-hidden="true" hides it from the VoiceOver screen reader, because a blind
    user does not need the raw video described — our app does the talking instead.
  -->
  <video id="camera" playsinline muted autoplay aria-hidden="true"></video>

  <!--
    ONE big button that fills the whole screen.
    A blind user can tap absolutely anywhere and hit it.
    aria-label is the text VoiceOver reads out when the button is focused.
  -->
  <button id="mainButton" aria-label="Tap anywhere to start BlindAiGlass">
    <span id="buttonText">Tap Anywhere<br />to Start</span>
  </button>

  <!--
    A status line at the top.
    aria-live="polite" means VoiceOver will read out any text we put here,
    which is a nice backup to our own spoken voice.
  -->
  <div id="status" role="status" aria-live="polite">Getting ready…</div>

  <!--
    A bottom control bar with two extra buttons. Hidden until the app has started.
    - Read: takes a photo and reads any text out loud (menus, signs, labels).
    - Unit: cycles the distance unit between steps, feet, and meters.
    The bar itself ignores taps (pointer-events: none in CSS); only the two
    buttons are tappable, so taps in the gaps still reach the big "Ask" button.
  -->
  <div id="controls" hidden>
    <button id="readButton" class="control" aria-label="Read text out loud">
      📖<br />Read
    </button>
    <button id="unitButton" class="control" aria-label="Distance unit: steps. Tap to change.">
      📏<br />Steps
    </button>
  </div>

  <!--
    The on-device AI vision libraries, loaded from a free public CDN.
    - tfjs: TensorFlow.js — runs AI models right inside the browser using the phone's GPU.
    - coco-ssd: a small, ready-trained model that recognizes ~80 everyday objects
      (person, chair, car, bottle, dog, and more). No training needed from us.
    These download once (a few MB) and then run fully on the phone.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
